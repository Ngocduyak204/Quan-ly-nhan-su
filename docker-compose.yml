version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: qlnv_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qlnv_sl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend NestJS API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qlnv_backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/qlnv_sl_db?schema=public"
      JWT_ACCESS_SECRET: "super-secret-access-token-key-qlnv-sl-2026"
      JWT_REFRESH_SECRET: "super-secret-refresh-token-key-qlnv-sl-2026"
      JWT_ACCESS_EXPIRATION: "1d"
      JWT_REFRESH_EXPIRATION: "7d"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qlnv_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Nginx Router & Reverse Proxy
  router:
    image: nginx:alpine
    container_name: qlnv_router
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
